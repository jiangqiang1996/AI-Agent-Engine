<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目文件关系图谱预览</title>
  <style>
    :root{--ink:#18212f;--muted:#5d697a;--soft:#7c8798;--line:#d8dee8;--line-strong:#c6cedb;--paper:#fffdf8;--panel:#ffffff;--wash:#f3f0e8;--canvas:#eef3f8;--navy:#172640;--blue:#23699a;--teal:#0f8b8d;--green:#237a57;--amber:#bd7118;--rose:#b5475b;--violet:#6f5ca8;--shadow:0 24px 70px rgba(23,38,64,.18);--small-shadow:0 8px 24px rgba(23,38,64,.09)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Segoe UI",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;display:flex;flex-direction:column;height:100vh;background:#f4f6f8;color:var(--ink)}
    button,input,select{font:inherit}
    button:focus-visible,input:focus-visible,select:focus-visible,.close:focus-visible{outline:2px solid #0969da;outline-offset:2px;border-radius:4px}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 16px;background:#fff;border-bottom:1px solid #e1e4e8;box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;z-index:5}
    .brand{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid #e1e4e8;margin-right:2px;min-width:0;flex-shrink:0}
    .brand-kicker{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#656d76}
    .brand-title{font-size:17px;font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--navy)}
    .brand-subtitle{font-size:11px;color:#656d76;white-space:nowrap}
    .tb-section{display:flex;align-items:center;flex-wrap:wrap;gap:5px 8px;min-width:0}
    .tb-section:first-child{padding-right:0}
    .toolbar .control-group{display:flex;align-items:center;gap:3px;flex-shrink:0}
    .toolbar label{font-size:10px;color:#656d76;font-weight:600;white-space:nowrap}
    .toolbar input[type=text]{flex:1;min-width:100px;max-width:160px;height:30px;padding:0 8px;border:1px solid #d0d7de;border-radius:6px;background:#f6f8fa;color:var(--ink);font-size:12px}
    .toolbar input[type=text]::placeholder{color:#8c959f}
    .toolbar input[type=text]:focus{border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.12);outline:none;background:#fff}
    .toolbar select,.toolbar button{height:30px;padding:0 8px;border:1px solid #d0d7de;border-radius:6px;font-size:12px;background:#f6f8fa;color:var(--ink);cursor:pointer}
    .toolbar button{font-weight:600;background:#f6f8fa}
    .toolbar button:hover{border-color:#0969da;background:#fff}
    #btnRender{background:#0969da;color:#fff;border-color:#0969da;padding:0 12px;font-weight:600}
    #btnRender:hover{background:#0550ae;border-color:#0550ae}
    #status{font-size:11px;color:#1a7f37;background:#dafbe1;border:1px solid #aceebb;padding:3px 8px;border-radius:6px;font-weight:600;white-space:nowrap}
    .legend{display:flex;align-items:center;gap:6px;font-size:11px;color:#656d76;flex-wrap:wrap;padding:3px 8px;border-radius:6px;background:#f6f8fa;border:1px solid #e1e4e8;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .main{display:grid;grid-template-columns:minmax(260px,18vw) minmax(0,1fr) auto;flex:1;overflow:hidden;padding:12px;gap:12px}
    #sidebar,#panel{background:#fff;border:1px solid #d0d7de;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden}
    #sidebar{display:flex;flex-direction:column;min-height:0}
    .side-head{padding:12px 14px 8px;border-bottom:1px solid #e1e4e8;background:#fff}
    #sidebar h2{font-size:14px;margin-bottom:3px;color:var(--navy);font-weight:700;letter-spacing:-.01em}
    .side-help{font-size:11px;line-height:1.45;color:#656d76}
    #sidebar .side-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px;border-bottom:1px solid #e1e4e8}
    #sidebar button{padding:5px 8px;border:1px solid #d0d7de;border-radius:6px;font-size:12px;background:#f6f8fa;color:var(--ink);cursor:pointer;font-weight:600}
    #sidebar button:hover{border-color:#0969da;background:#fff}
    .side-actions button{box-shadow:none}
    #btnShowHidden{background:#fff8c5;border-color:#d4a72c;color:#7d4e00}
    #btnShowHidden:hover{background:#fff5b3;border-color:#bf8f0f}
    .dir-list{display:flex;flex-direction:column;font-size:13px;padding:4px 0;overflow:auto}
    .dir-row{position:relative;display:block;padding:5px 12px 5px 0;border-bottom:1px solid transparent;border-left:3px solid transparent;transition:background .12s ease,border-color .12s ease,opacity .12s ease}
    .dir-row:last-child{border-bottom:none}
    .dir-row:before{content:"";position:absolute;left:var(--tree-line-left,14px);top:-4px;bottom:0;width:1px;background:#d0d7de}
    .dir-row:after{content:"";position:absolute;left:var(--tree-line-left,14px);top:12px;width:8px;height:1px;background:#d0d7de}
    .dir-row[data-depth="0"]:before,.dir-row[data-depth="0"]:after{display:none}
    .dir-row:hover{background:#f6f8fa;border-left-color:#0969da}
    .dir-row.unselected{border-left-color:#d1242f;background:#fff5f5}
    .dir-row.unselected .dir-name{color:#cf222e;text-decoration:none;font-weight:600}
    .dir-row.unselected .dir-check{opacity:.4}
    .dir-row.inherited-unselected{opacity:.55;border-left-color:#d0d7de;background:transparent}
    .dir-row.inherited-unselected .dir-name{color:#656d76}
    .dir-row.inherited-unselected .dir-check{opacity:.25}
    .dir-main{display:flex;align-items:center;gap:3px;min-width:0}
    .dir-caret{width:18px;flex:0 0 18px;height:18px;display:flex;align-items:center;justify-content:center;color:#656d76;font-size:11px;text-align:center;border:none;background:transparent;cursor:pointer;border-radius:4px;padding:0}
    .dir-caret:hover{color:#0969da;background:#e1e4e8}
    .dir-caret:disabled{cursor:default;color:#b0b8c4;opacity:.6}
    .dir-caret:disabled:hover{background:transparent}
    .dir-check{width:14px;flex:0 0 14px;display:flex;align-items:center;justify-content:center;color:#1a7f37;font-size:11px}
    .dir-name{font-family:ui-monospace,SFMono-Regular,SFMono,Consolas,"Liberation Mono",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0;cursor:pointer;border:none;background:none;font-size:13px;color:#1f2328;line-height:1.35;min-width:0;font-weight:500}
    .dir-name:hover{color:#0969da}
    .dir-name:focus{outline:none;color:#0969da}
    .dir-path{display:none}
    .dir-meta{display:block;color:#656d76;white-space:nowrap;font-size:10px;margin-top:0;padding-left:35px}
    #cyWrap{position:relative;display:flex;min-width:0;border-radius:12px;overflow:hidden;border:1px solid #d0d7de;box-shadow:0 1px 3px rgba(0,0,0,.04);background:#fff}
    #cy{flex:1;background:#fff}
    #cyWrap:after{content:"GRAPH";position:absolute;right:14px;bottom:12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#b0b8c4;pointer-events:none;font-weight:700}
    .metric-strip{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:4;pointer-events:none}
    .metric{min-width:68px;padding:5px 10px;border:1px solid #d0d7de;border-radius:6px;background:#fff}
    .metric b{display:block;font-size:16px;line-height:1;color:var(--navy);letter-spacing:-.02em;font-weight:700}
    .metric span{display:block;margin-top:2px;font-size:10px;font-weight:600;color:#656d76;letter-spacing:.02em;text-transform:uppercase}
    .empty-state{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:400px;padding:20px 24px;border:1px solid #d0d7de;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);font-size:13px;line-height:1.6;color:#656d76;display:none;text-align:center}
    .empty-state strong{display:block;font-size:15px;color:var(--navy);margin-bottom:6px;font-weight:600}
    #panel{width:360px;display:none;flex-direction:column;min-height:0}
    #panel.open{display:flex}
    .panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #e1e4e8;background:#fff;flex-shrink:0}
    #panel h3{margin:0;font-size:14px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
    #panel .close{cursor:pointer;font-size:18px;line-height:1;color:#656d76;padding:4px 8px;border-radius:6px}
    #panel .close:hover{color:var(--navy);background:#f6f8fa}
    #detail{padding:12px 16px;font-size:13px;line-height:1.6;color:var(--ink);overflow-y:auto}
    #detail p{margin-bottom:8px}
    #detail ul{margin:4px 0 12px 0;list-style:none}
    #detail li{word-break:break-all;padding:7px 0;border-bottom:1px solid #e1e4e8}
    #detail li:last-child{border-bottom:none}
    #detail table{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0 14px;font-size:12px;border:1px solid #d0d7de;border-radius:10px;overflow:hidden;background:#fff}
    #detail th,#detail td{padding:7px 10px;text-align:left;vertical-align:top;word-break:break-all;border-bottom:1px solid #e1e4e8}
    #detail tr:last-child th,#detail tr:last-child td{border-bottom:none}
    #detail th{width:96px;background:#f6f8fa;color:#656d76;font-weight:600;white-space:nowrap}
    #detail small{color:#656d76}
    #detail .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;margin:2px;font-weight:600}
    .badge-src{background:#ddf4ff;color:#0969da}.badge-doc{background:#dafbe1;color:#1a7f37}.badge-cfg{background:#fff8c5;color:#7d4e00}.badge-dir{background:#eaeef2;color:#57606a}.badge-asset,.badge-symbol{background:#fbefff;color:#8250df}.badge-rel{background:#f6f8fa;color:#57606a;border:1px solid #d0d7de}
    .hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#24292f;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s ease,transform .2s ease;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:30}
    .hint.show{opacity:.95;transform:translateX(-50%) translateY(-4px)}
    .node-tip{position:absolute;display:none;max-width:480px;padding:8px 12px;border-radius:8px;background:#24292f;color:#fff;font-size:12px;line-height:1.5;word-break:break-all;pointer-events:none;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    @media (max-width: 1180px){.main{grid-template-columns:240px minmax(0,1fr) auto;gap:10px;padding:10px}#panel{width:320px}.brand-subtitle{display:none}.toolbar input[type=text]{max-width:160px}}
    @media (max-width: 980px){.main{grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}#panel{position:fixed;top:64px;right:10px;bottom:10px;width:min(340px,86vw);z-index:50}.toolbar input[type=text]{max-width:140px}}
    @media (max-width: 760px){.main{grid-template-columns:1fr;grid-template-rows:auto minmax(40vh,1fr);padding:8px;gap:8px}#sidebar{max-height:30vh;border-radius:10px}#cyWrap{min-height:44vh;border-radius:10px}#panel{top:10px;right:10px;bottom:10px}.toolbar{padding:8px 12px;gap:6px 8px}.toolbar input[type=text]{max-width:none;min-width:80px;height:30px}.toolbar select,.toolbar button{height:30px;padding:0 8px;font-size:12px}.control-group{gap:3px}.tb-section{gap:5px 6px}}
    @media (max-width: 520px){.brand-title{font-size:16px}.brand-kicker{font-size:9px}.tb-section{gap:5px}.toolbar input[type=text]{min-width:70px}.legend{padding:3px 6px;font-size:11px;gap:5px}#sidebar{max-height:26vh}.dir-row{padding:5px 10px 5px 0}.dir-meta{font-size:10px;padding-left:36px}}
  </style>
</head>
<body>
<div class="toolbar">
  <div class="brand">
    <div class="brand-kicker">AE Graph</div>
    <div class="brand-title">关系图谱</div>
    <div class="brand-subtitle">代码结构、依赖与影响面预览</div>
  </div>
  <div class="tb-section">
    <div class="control-group"><label for="dirFilter">目录</label><input type="text" id="dirFilter" placeholder="如 src/services"></div>
    <div class="control-group"><label for="relationSearch">关系</label><input type="text" id="relationSearch" placeholder="搜索关系、证据或路径"></div>
    <div class="control-group"><label for="granularityMode">粒度</label><select id="granularityMode"><option value="file" selected>文件级</option><option value="symbol">内部元素</option><option value="mixed">文件+元素</option></select></div>
    <div class="control-group"><label for="typeFilter">类型</label><select id="typeFilter"><option value="">全部</option><option value="contains">contains</option><option value="import">import</option><option value="require">require</option><option value="include">include</option><option value="link">link</option><option value="directory">directory</option><option value="external">external</option></select></div>
    <div class="control-group"><label for="layoutMode">布局</label><select id="layoutMode"><option value="cose" selected>力导向</option><option value="breadthfirst">依赖层级</option><option value="grid">网格</option></select></div>
    <div class="control-group"><label for="nodeLimit">最大节点</label><select id="nodeLimit"><option value="80" selected>80</option><option value="150">150</option><option value="500">500</option><option value="0">全部</option></select></div>
    <button id="btnRender">渲染</button>
    <button id="btnFit">适应</button>
  </div>
  <div class="tb-section" style="gap:12px">
    <span id="status">加载中...</span>
    <span class="legend"><span class="dot" style="background:#0969da"></span>源码 <span class="dot" style="background:#1a7f37"></span>文档 <span class="dot" style="background:#9a6700"></span>配置 <span class="dot" style="background:#8250df"></span>元素 <span class="dot" style="background:#6e7781"></span>目录</span>
  </div>
</div>
<div class="main">
  <aside id="sidebar">
    <div class="side-head">
      <h2>目录浏览</h2>
      <div class="side-help">默认全选。点击目录名切换当前目录及下级显示；点击箭头展开或折叠。</div>
    </div>
    <div class="side-actions">
      <button id="btnClearDir">清除筛选</button>
      <button id="btnShowHidden">全选目录</button>
    </div>
    <div id="directoryList" class="dir-list"></div>
  </aside>
  <div id="cyWrap">
    <div class="metric-strip">
      <div class="metric"><b id="metricNodes">--</b><span>节点</span></div>
      <div class="metric"><b id="metricEdges">--</b><span>关系</span></div>
      <div class="metric"><b id="metricHidden">0</b><span>取消目录</span></div>
    </div>
    <div id="cy"></div>
    <div id="emptyState" class="empty-state"></div>
  </div>
  <div id="panel">
    <div class="panel-header">
      <h3>节点详情</h3>
      <span class="close" onclick="closePanel()">&times;</span>
    </div>
    <div id="detail"></div>
  </div>
</div>
<div class="hint" id="hint"></div>
<div class="node-tip" id="nodeTip"></div>
<script>
  var GRAPH_BASE = '.';
  var ALL_NODES = [];
  var ALL_EDGES = [];
  var CY = null;
  var UNSELECTED_DIRS = {};
  var COLLAPSED_DIRS = {};

  var TYPE_COLORS = {
    import: '#0969da',
    require: '#8250df',
    link: '#1a7f37',
    include: '#bf3989',
    directory: '#6e7781',
    contains: '#8250df',
    external: '#d4a72c'
  };
  var FILE_COLORS = {source:'#0969da',document:'#1a7f37',config:'#9a6700',directory:'#6e7781',asset:'#8250df'};
  var FILE_BADGES = {source:'src',document:'doc',config:'cfg',directory:'dir',asset:'asset',external:'ext',symbol:'sym'};

  function badge(type, label) {
    var map = {source:'src',document:'doc',config:'cfg',directory:'dir',external:'asset',symbol:'symbol',rel:'rel',asset:'asset',src:'src',doc:'doc',cfg:'cfg',dir:'dir'};
    var safeType = map[type] || 'asset';
    var cls = safeType === 'rel' ? 'badge badge-rel' : 'badge badge-' + safeType;
    return '<span class="' + cls + '">' + escapeHtml(label) + '</span>';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"]/g, function(ch) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];
    });
  }

  function formatValue(value) {
    if (value === undefined || value === null || value === '') return '';
    if (typeof value === 'object') return escapeHtml(JSON.stringify(value));
    return escapeHtml(value);
  }

  function detailRows(rows) {
    var html = '<table>';
    rows.forEach(function(row) {
      if (row[1] === undefined || row[1] === null || row[1] === '') return;
      html += '<tr><th>' + escapeHtml(row[0]) + '</th><td>' + formatValue(row[1]) + '</td></tr>';
    });
    return html + '</table>';
  }

  function nodeId(file) {
    return file.id || (file.fileType === 'directory' ? 'directory:' + file.relativePath : 'file:' + file.relativePath);
  }

  function nodeType(file) {
    return file.kind === 'symbol' ? 'symbol' : file.fileType;
  }

  function findNodeById(id) {
    for (var i = 0; i < ALL_NODES.length; i += 1) {
      if (nodeId(ALL_NODES[i]) === id) return ALL_NODES[i];
    }
    return null;
  }

  function makeCyNode(file) {
    return {data: {id: nodeId(file), label: file.kind === 'symbol' ? file.label : fileName(file.relativePath), fullLabel: file.kind === 'symbol' ? file.relativePath + '#' + (file.label || file.nodePath || '') : file.relativePath, type: nodeType(file), path: file.relativePath, parentId: file.parentId || '', symbolKind: file.symbolKind || '', range: file.range || null, language: file.language || ''}};
  }

  function relationSourceId(relation) {
    return relation.sourceId || 'file:' + relation.sourcePath;
  }

  function relationTargetId(relation) {
    if (relation.targetId) return relation.targetId;
    if (relation.relationType === 'directory') return 'directory:' + relation.targetPath;
    return relation.relationType === 'external' ? 'external:unknown:' + relation.targetPath : 'file:' + relation.targetPath;
  }

  function relationPathForId(relation, id, isSource) {
    if (id.indexOf('file:') === 0 || id.indexOf('directory:') === 0) return id.split(':').slice(1).join(':');
    return isSource ? relation.sourcePath : relation.targetPath;
  }

  function relationEndpointLabel(relation, id, isSource) {
    var node = findNodeById(id);
    if (node && node.kind === 'symbol') return node.relativePath + '#' + (node.label || node.nodePath || id);
    return relationPathForId(relation, id, isSource);
  }

  function virtualNodeType(id) {
    if (id.indexOf('directory:') === 0) return 'directory';
    if (id.indexOf('external:') === 0 || id.indexOf('unresolved:') === 0) return 'external';
    return 'source';
  }

  function fileName(path) {
    var parts = path.split('/');
    return parts[parts.length - 1] || path;
  }

  function parentDirectories(path) {
    var parts = String(path || '').split('/').filter(Boolean);
    var dirs = [];
    for (var i = 1; i < parts.length; i += 1) dirs.push(parts.slice(0, i).join('/'));
    return dirs;
  }

  function isUnselectedPath(path) {
    var value = String(path || '');
    var unselected = Object.keys(UNSELECTED_DIRS);
    for (var i = 0; i < unselected.length; i += 1) {
      var dir = unselected[i];
      if (value === dir || value.indexOf(dir + '/') === 0) return true;
    }
    return false;
  }

  function isCollapsedPath(path) {
    var value = String(path || '');
    var collapsed = Object.keys(COLLAPSED_DIRS);
    for (var i = 0; i < collapsed.length; i += 1) {
      var dir = collapsed[i];
      if (value !== dir && value.indexOf(dir + '/') === 0) return true;
    }
    return false;
  }

  function visibleNode(node) {
    return !isUnselectedPath(node.relativePath || node.path || '');
  }

  function visibleRelation(relation) {
    return !isUnselectedPath(relation.sourcePath) && !isUnselectedPath(relation.targetPath);
  }

  function buildDirectoryStats(files) {
    var stats = {};
    files.forEach(function(file) {
      if (!file.relativePath || file.kind === 'symbol') return;
      parentDirectories(file.relativePath).forEach(function(dir) {
        if (!stats[dir]) stats[dir] = {path: dir, files: 0, relations: 0};
        stats[dir].files += 1;
      });
    });
    ALL_EDGES.forEach(function(relation) {
      var seen = {};
      parentDirectories(relation.sourcePath).concat(parentDirectories(relation.targetPath)).forEach(function(dir) {
        if (!stats[dir] || seen[dir]) return;
        stats[dir].relations += 1;
        seen[dir] = 1;
      });
    });
    return Object.keys(stats).sort(function(a, b) {
      return a.split('/').length - b.split('/').length || a.localeCompare(b);
    }).map(function(path) { return stats[path]; });
  }

  function renderDirectoryList() {
    var list = document.getElementById('directoryList');
    var dirs = buildDirectoryStats(ALL_NODES);
    if (dirs.length === 0) {
      list.innerHTML = '<div class="side-help">暂无可浏览目录。</div>';
      return;
    }
    list.innerHTML = dirs.map(function(dir) {
      if (isCollapsedPath(dir.path)) return '';
      var depth = Math.max(0, dir.path.split('/').length - 1);
      var directUnselected = UNSELECTED_DIRS[dir.path];
      var selected = !isUnselectedPath(dir.path);
      var inheritedUnselected = !selected && !directUnselected;
      var name = dir.path.split('/').pop() || dir.path;
      var hasChildren = dirs.some(function(child) { return child.path.indexOf(dir.path + '/') === 0; });
      var collapsed = COLLAPSED_DIRS[dir.path];
      var lineLeft = 14 + depth * 16 - 8;
      return '<div class="dir-row' + (directUnselected ? ' unselected' : '') + (inheritedUnselected ? ' inherited-unselected' : '') + '" data-depth="' + depth + '" style="padding-left:' + (14 + depth * 16) + 'px;--tree-line-left:' + lineLeft + 'px">'
              + '<span class="dir-main">'
              + '<button class="dir-caret" data-dir-collapse="' + escapeHtml(dir.path) + '" title="展开或折叠目录"' + (hasChildren ? '' : ' disabled') + '>' + (hasChildren ? (collapsed ? '▸' : '▾') : '•') + '</button>'
              + '<span class="dir-check">' + (selected ? '✓' : '○') + '</span>'
              + '<span style="min-width:0"><button title="切换显示: ' + escapeHtml(dir.path) + '" data-dir-toggle="' + escapeHtml(dir.path) + '" class="dir-name">' + escapeHtml(name) + '</button><span class="dir-path">' + escapeHtml(dir.path) + '</span></span></span>'
              + '<span class="dir-meta">' + dir.files + ' 文件 · ' + dir.relations + ' 关系' + (inheritedUnselected ? ' · 上级已取消' : '') + '</span>'
              + '</div>';
    }).join('');
  }

  async function loadJSON(path) {
    var res = await fetch(path);
    if (!res.ok) throw new Error('加载失败: ' + path + ' (' + res.status + ')');
    return res.json();
  }

  async function loadGraphData() {
    var store = await loadJSON(GRAPH_BASE + '/graph.json');
    var active = null;
    for (var i = 0; i < (store.versions || []).length; i++) {
      if (store.versions[i].isActive) { active = store.versions[i]; break; }
    }
    if (!active) throw new Error('未找到 active version，请先执行 ae-graph-build');
    var versionDir = GRAPH_BASE + '/version-' + active.id;
    var manifest = await loadJSON(versionDir + '/manifest.json');
    var chunkIds = manifest.chunks || [];
    var files = [];
    var relations = [];
    for (var i = 0; i < chunkIds.length; i++) {
      var chunk = await loadJSON(versionDir + '/' + chunkIds[i] + '.json');
      if (chunk.files) files = files.concat(chunk.files);
      if (chunk.relations) relations = relations.concat(chunk.relations);
    }
    return {files: files, relations: relations, manifest: manifest};
  }

  function relationMatchesSearch(relation, search) {
    if (!search) return true;
    var text = [relation.relationType, relation.type, relation.sourcePath, relation.targetPath, relation.evidence, relation.reason].join(' ').toLowerCase();
    return text.indexOf(search.toLowerCase()) >= 0;
  }

  function buildCyData(files, relations, fileFilter, typeFilter, nodeLimit, granularity, relationSearch) {
    var filteredFiles = files.filter(function(f) {
      if (!visibleNode(f)) return false;
      if (fileFilter && f.relativePath.indexOf(fileFilter) !== 0) return false;
      if (granularity === 'file') return f.kind !== 'symbol' && f.fileType !== 'directory';
      if (granularity === 'symbol') return f.kind === 'symbol';
      return f.fileType !== 'directory';
    });
    var filteredRelations = relations.filter(function(r) {
      if (!visibleRelation(r)) return false;
      if (typeFilter && r.relationType !== typeFilter) return false;
      if (!relationMatchesSearch(r, relationSearch)) return false;
      if (!fileFilter && r.relationType === 'directory') return false;
      if (granularity === 'file' && r.relationType === 'contains') return false;
      if (granularity === 'symbol' && r.relationType !== 'contains' && relationSourceId(r).indexOf('symbol:') !== 0 && relationTargetId(r).indexOf('symbol:') !== 0) return false;
      if (fileFilter && r.sourcePath.indexOf(fileFilter) !== 0 && r.targetPath.indexOf(fileFilter) !== 0) return false;
      return true;
    });
    var degreeById = {};
    filteredRelations.forEach(function(r) {
      var source = relationSourceId(r);
      var target = relationTargetId(r);
      degreeById[source] = (degreeById[source] || 0) + 1;
      degreeById[target] = (degreeById[target] || 0) + 1;
    });
    var nodes = filteredFiles.filter(function(f) { return degreeById[nodeId(f)]; });
    nodes.sort(function(a, b) {
      var aDegree = (degreeById[nodeId(a)] || 0);
      var bDegree = (degreeById[nodeId(b)] || 0);
      return bDegree - aDegree || a.relativePath.localeCompare(b.relativePath);
    });
    if (nodeLimit > 0 && nodes.length > nodeLimit) nodes = nodes.slice(0, nodeLimit);
    var nodeSet = {};
    nodes.forEach(function(n) { nodeSet[nodeId(n)] = 1; });
    var edges = filteredRelations.filter(function(r) { return nodeSet[relationSourceId(r)] || nodeSet[relationTargetId(r)]; });
    var cyNodes = nodes.map(makeCyNode);
    var virtualNodes = {};
    var seen = {};
    var cyEdges = [];
    edges.forEach(function(r, i) {
      var source = relationSourceId(r);
      var target = relationTargetId(r);
      if (!nodeSet[source] && !virtualNodes[source]) {
        virtualNodes[source] = findNodeById(source) || {id: source, path: relationPathForId(r, source, true), type: virtualNodeType(source)};
      }
      if (!nodeSet[target] && !virtualNodes[target]) {
        virtualNodes[target] = findNodeById(target) || {id: target, path: relationPathForId(r, target, false), type: virtualNodeType(target)};
      }
      var key = source + '\0' + target + '\0' + r.relationType;
      if (seen[key]) return;
      seen[key] = 1;
      cyEdges.push({data: {id: 'e' + i, source: source, target: target, relType: r.relationType, label: r.relationType, evidence: r.evidence || (r.metadata && r.metadata.raw) || '', reason: r.reason || '', range: r.range || null, confidence: r.confidence || '', parser: r.parser || '', searchMatch: relationSearch ? 'true' : 'false'}});
    });
    Object.keys(virtualNodes).forEach(function(id) {
      var node = virtualNodes[id];
      cyNodes.push(node.relativePath ? makeCyNode(node) : {data: {id: id, label: fileName(node.path), fullLabel: node.path, type: node.type, path: node.path, language: ''}});
    });
    return {cyNodes: cyNodes, cyEdges: cyEdges, stats: {nodes: cyNodes.length, edges: cyEdges.length, filteredFiles: filteredFiles.length, filteredRelations: filteredRelations.length}};
  }

  function graphLayout(mode, count) {
    if (mode === 'grid' || count > 250) {
      return {name: 'grid', animate: false, padding: 60, avoidOverlap: true, avoidOverlapPadding: 18};
    }
    if (mode === 'cose') {
      return {name: 'cose', animate: false, nodeRepulsion: function(){return 22000}, idealEdgeLength: function(){return 200}, nodeOverlap: 20, numIter: 800, padding: 90, randomize: true};
    }
    return {name: 'breadthfirst', directed: true, animate: false, padding: 100, spacingFactor: 2.4, avoidOverlap: true, nodeDimensionsIncludeLabels: true};
  }

  function renderGraph(cyData) {
    if (CY) CY.destroy();
    document.getElementById('metricNodes').textContent = cyData.stats.nodes;
    document.getElementById('metricEdges').textContent = cyData.stats.edges;
    document.getElementById('metricHidden').textContent = Object.keys(UNSELECTED_DIRS).length;
    var emptyState = document.getElementById('emptyState');
    if (cyData.cyNodes.length === 0) {
      emptyState.innerHTML = '<strong>当前筛选没有可渲染节点</strong><br>请放宽目录/关系筛选，或点击左侧“全选目录”恢复目录选择。';
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
    }
    var layoutMode = document.getElementById('layoutMode').value;
    document.getElementById('status').textContent = '渲染中: ' + cyData.stats.nodes + ' 节点 / ' + cyData.stats.edges + ' 边...';
    CY = cytoscape({
      container: document.getElementById('cy'),
      elements: {nodes: cyData.cyNodes, edges: cyData.cyEdges},
      style: [
        {selector: 'node', style: {
            'background-color': function(ele) { return FILE_COLORS[ele.data('type')] || '#6e7781'; },
            'label': function(ele) { return FILE_BADGES[ele.data('type')] + '  ' + ele.data('label'); },
            'font-size': '12px', 'font-weight': 700,
            'width': 32, 'height': 32,
            'text-valign': 'bottom', 'text-halign': 'center', 'text-margin-y': 10,
            'color': '#1f2937', 'text-background-color': '#ffffff', 'text-background-opacity': 0.98,
            'text-background-padding': 5, 'text-border-color': '#d0d7de', 'text-border-width': 1, 'text-border-opacity': 0.75,
            'text-max-width': '170px', 'text-wrap': 'ellipsis', 'text-overflow-wrap': 'anywhere',
            'border-width': 2.5, 'border-color': '#fff', 'overlay-opacity': 0, 'z-index': 3
          }},
        {selector: 'node[type = "symbol"]', style: {'shape': 'round-rectangle', 'background-color': '#8250df', 'width': 34, 'height': 22, 'z-index': 3}},
        {selector: 'node:selected', style: {'border-width': 4, 'border-color': '#0969da', 'border-opacity': 1, 'z-index': 10}},
        {selector: 'edge', style: {
            'line-color': function(ele) { return TYPE_COLORS[ele.data('relType')] || '#d1d5da'; },
            'target-arrow-color': function(ele) { return TYPE_COLORS[ele.data('relType')] || '#d1d5da'; },
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier', 'control-point-step-size': 40,
            'width': 1.6, 'opacity': 0.7,
            'arrow-scale': 1,
            'label': function(ele) { return ele.data('relType') === 'directory' ? '' : ele.data('label'); },
            'font-size': '9px', 'color': '#4b5563', 'text-rotation': 'autorotate', 'text-margin-y': -9,
            'text-background-color': '#fff', 'text-background-opacity': 0.8, 'text-background-padding': 2
          }},
        {selector: 'edge[searchMatch = "true"]', style: {'width': 3.5, 'opacity': 1, 'z-index': 999}},
        {selector: 'edge:selected', style: {'width': 3.5, 'opacity': 1, 'z-index': 999}},
        {selector: '.faded', style: {'opacity': 0.12, 'text-opacity': 0.08}},
        {selector: '.highlighted', style: {'opacity': 1, 'text-opacity': 1, 'z-index': 999}}
      ],
      layout: graphLayout(layoutMode, cyData.stats.nodes),
      wheelSensitivity: 0.25, minZoom: 0.08, maxZoom: 5
    });
    CY.on('tap', 'node', function(evt) { focusNode(evt.target); showDetail(evt.target.data()); });
    CY.on('mouseover', 'node', function(evt) { showNodeTip(evt.target, evt.originalEvent); });
    CY.on('mousemove', 'node', function(evt) { moveNodeTip(evt.originalEvent); });
    CY.on('mouseout', 'node', hideNodeTip);
    CY.on('tap', function(evt) { if (evt.target === CY) closePanel(); });
    document.getElementById('status').textContent = '已渲染: ' + cyData.stats.nodes + ' 节点 / ' + cyData.stats.edges + ' 边 | 候选: ' + cyData.stats.filteredFiles + ' 文件 / ' + cyData.stats.filteredRelations + ' 关系 | 已取消目录: ' + Object.keys(UNSELECTED_DIRS).length;
    setTimeout(function() { if (CY) { var n = CY.nodes().length; CY.fit(undefined, n > 120 ? 140 : 80); } }, 120);
  }

  function showNodeTip(node, event) {
    var tip = document.getElementById('nodeTip');
    tip.textContent = node.data('fullLabel') || node.data('label') || node.data('path') || node.data('id');
    tip.style.display = 'block';
    moveNodeTip(event);
  }

  function moveNodeTip(event) {
    var tip = document.getElementById('nodeTip');
    if (!event || tip.style.display !== 'block') return;
    var x = event.clientX + 12;
    var y = event.clientY + 12;
    var maxX = window.innerWidth - tip.offsetWidth - 8;
    var maxY = window.innerHeight - tip.offsetHeight - 8;
    tip.style.left = Math.max(8, Math.min(x, maxX)) + 'px';
    tip.style.top = Math.max(8, Math.min(y, maxY)) + 'px';
  }

  function hideNodeTip() {
    document.getElementById('nodeTip').style.display = 'none';
  }

  function focusNode(node) {
    if (!CY) return;
    CY.elements().addClass('faded').removeClass('highlighted');
    var neighborhood = node.closedNeighborhood();
    neighborhood.removeClass('faded').addClass('highlighted');
    node.removeClass('faded').addClass('highlighted');
  }

  function showDetail(nodeData) {
    var path = nodeData.path;
    var isSymbol = nodeData.type === 'symbol';
    var originalNode = findNodeById(nodeData.id) || {};
    var outEdges = ALL_EDGES.filter(function(r) { return relationSourceId(r) === nodeData.id || (!isSymbol && r.sourcePath === path); });
    var inEdges = ALL_EDGES.filter(function(r) { return relationTargetId(r) === nodeData.id || (!isSymbol && r.targetPath === path); });
    var html = '<p><strong>' + escapeHtml(path) + '</strong></p>';
    if (isSymbol) {
      html += '<p><strong>元素：</strong>' + escapeHtml(nodeData.label) + '</p>';
      html += '<p>' + badge('symbol', nodeData.symbolKind || 'symbol') + (nodeData.range ? ' ' + badge('asset', 'L' + nodeData.range.startLine) : '') + '</p>';
    } else {
      html += '<p>' + badge(nodeData.type, nodeData.type) + (nodeData.language ? ' ' + badge('asset', nodeData.language) : '') + '</p>';
    }
    html += detailRows([
      ['节点 ID', nodeData.id],
      ['类型', nodeData.type],
      ['文件类型', originalNode.fileType],
      ['语言', originalNode.language || nodeData.language],
      ['大小', originalNode.sizeBytes ? originalNode.sizeBytes + ' bytes' : ''],
      ['解析器', originalNode.parser],
      ['父节点', originalNode.parentId],
      ['节点路径', originalNode.nodePath],
      ['范围', originalNode.range]
    ]);
    if (outEdges.length > 0) {
      html += '<p><strong>依赖 (' + outEdges.length + '):</strong></p><ul>';
      outEdges.forEach(function(r) { html += '<li>' + badge('rel', r.relationType) + ' → ' + escapeHtml(relationEndpointLabel(r, relationTargetId(r), false)) + '<br><small>' + escapeHtml([r.confidence, r.parser, r.range ? 'L' + r.range.startLine : '', r.reason].filter(Boolean).join(' | ')) + '</small>' + (r.evidence ? '<br><small>证据: ' + escapeHtml(r.evidence) + '</small>' : '') + '</li>'; });
      html += '</ul>';
    }
    if (inEdges.length > 0) {
      html += '<p><strong>被依赖 (' + inEdges.length + '):</strong></p><ul>';
      inEdges.forEach(function(r) { html += '<li>' + badge('rel', r.relationType) + ' ← ' + escapeHtml(relationEndpointLabel(r, relationSourceId(r), true)) + '<br><small>' + escapeHtml([r.confidence, r.parser, r.range ? 'L' + r.range.startLine : '', r.reason].filter(Boolean).join(' | ')) + '</small>' + (r.evidence ? '<br><small>证据: ' + escapeHtml(r.evidence) + '</small>' : '') + '</li>'; });
      html += '</ul>';
    }
    document.getElementById('detail').innerHTML = html;
    document.getElementById('panel').classList.add('open');
  }

  function closePanel() {
    document.getElementById('panel').classList.remove('open');
    if (CY) CY.elements().removeClass('faded highlighted');
  }

  function doRender() {
    var st = document.getElementById('status');
    st.style.background = '';
    st.style.color = '';
    var dir = document.getElementById('dirFilter').value.trim().replace(/\/+$/, '');
    var relationSearch = document.getElementById('relationSearch').value.trim();
    var granularity = document.getElementById('granularityMode').value;
    var type = document.getElementById('typeFilter').value;
    var limit = parseInt(document.getElementById('nodeLimit').value, 10);
    var cyData = buildCyData(ALL_NODES, ALL_EDGES, dir, type, limit, granularity, relationSearch);
    renderGraph(cyData);
    renderDirectoryList();
  }

  document.getElementById('btnRender').addEventListener('click', doRender);
  document.getElementById('btnFit').addEventListener('click', function() { if (CY) CY.fit(undefined, 50); });
  document.getElementById('btnClearDir').addEventListener('click', function() { document.getElementById('dirFilter').value = ''; doRender(); });
  document.getElementById('btnShowHidden').addEventListener('click', function() { UNSELECTED_DIRS = {}; doRender(); showHint('已全选所有目录'); });
  document.getElementById('directoryList').addEventListener('click', function(e) {
    var target = e.target;
    if (!target || !target.getAttribute) return;
    var collapseDir = target.getAttribute('data-dir-collapse');
    var toggleDir = target.getAttribute('data-dir-toggle');
    if (collapseDir) {
      if (COLLAPSED_DIRS[collapseDir]) delete COLLAPSED_DIRS[collapseDir];
      else COLLAPSED_DIRS[collapseDir] = true;
      renderDirectoryList();
      return;
    }
    if (toggleDir) {
      if (UNSELECTED_DIRS[toggleDir]) delete UNSELECTED_DIRS[toggleDir];
      else UNSELECTED_DIRS[toggleDir] = true;
      doRender();
    }
  });
  document.getElementById('dirFilter').addEventListener('keydown', function(e) { if (e.key === 'Enter') doRender(); });
  document.getElementById('relationSearch').addEventListener('keydown', function(e) { if (e.key === 'Enter') doRender(); });
  document.getElementById('granularityMode').addEventListener('change', doRender);
  document.getElementById('layoutMode').addEventListener('change', doRender);

  function showHint(msg) {
    var el = document.getElementById('hint');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.classList.remove('show'); }, 3000);
  }

  async function init() {
    try {
      var data = await loadGraphData();
      ALL_NODES = data.files;
      ALL_EDGES = data.relations;
      renderDirectoryList();
      document.getElementById('status').textContent = '已加载: ' + ALL_NODES.length + ' 文件 / ' + ALL_EDGES.length + ' 关系 | 正在渲染...';
      doRender();
      showHint('已加载 ' + ALL_NODES.length + ' 个文件和 ' + ALL_EDGES.length + ' 条关系。使用顶部筛选缩小范围后点击"渲染"。');
    } catch (err) {
      var st = document.getElementById('status');
      st.textContent = '加载失败: ' + err.message;
      st.style.background = '#ffebe9';
      st.style.color = '#cf222e';
      showHint('加载失败: ' + err.message);
    }
  }
</script>
<script src="cytoscape.min.js"></script>
<script>init()</script>
</body>
</html>
