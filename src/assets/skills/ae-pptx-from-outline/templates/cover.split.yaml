name: cover.split
description: 封面页：左侧大标题 + 右侧视觉元素（图片/形状）
category: cover
slots:
  - type: text
    slot: title
    x: 0.5
    y: 2.0
    w: 6.5
    h: 2.0
    fontSize: 40
    bold: true
    align: left
    valign: middle
  - type: text
    slot: subtitle
    x: 0.5
    y: 4.2
    w: 5.5
    h: 0.8
    fontSize: 18
    align: left
    valign: top
  - type: image
    slot: hero_image
    x: 7.5
    y: 1.5
    w: 5.3
    h: 4.5
tokens:
  title:
    description: 主标题文本
    required: true
    type: string
  subtitle:
    description: 副标题文本
    required: false
    type: string
  hero_image:
    description: 右侧主图路径或 base64
    required: true
    type: string
layoutHint: 左文右图分栏封面
