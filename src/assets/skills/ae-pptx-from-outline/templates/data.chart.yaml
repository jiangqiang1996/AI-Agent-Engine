name: data.chart
description: 数据页：标题 + 图表（bar/line/pie/doughnut）
category: data
slots:
  - type: text
    slot: title
    x: 0.5
    y: 0.5
    w: 12.33
    h: 0.9
    fontSize: 28
    bold: true
    align: left
    valign: middle
  - type: chart
    slot: chart
    x: 0.8
    y: 1.6
    w: 11.73
    h: 5.4
    chartType: bar
  - type: text
    slot: source_note
    x: 0.8
    y: 7.0
    w: 11.73
    h: 0.3
    fontSize: 10
    align: left
    valign: bottom
tokens:
  title:
    description: 页面标题
    required: true
    type: string
  chartType:
    description: 图表类型（bar/line/pie/doughnut/area）
    required: true
    type: string
  chartData:
    description: 图表数据（pptxgenjs chartData 格式）
    required: true
    type: chart_data
  source_note:
    description: 数据来源说明
    required: false
    type: string
layoutHint: 标题 + 全幅图表 + 底部来源标注
